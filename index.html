<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#101413" />

    <title>SWABox 电教工具箱 · 把要用的工具收进一个盒子</title>
    <meta
      name="description"
      content="SWABox 是给学校电教委用的 Windows 工具箱：优化工具、修复工具、维护文件、内置急救箱，装一次就不用再翻群文件和收藏夹。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SWABox 电教工具箱" />
    <meta
      property="og:description"
      content="优化工具、修复工具、维护文件、内置急救箱。一个安装包，开源，MIT 许可。"
    />
    <meta property="og:url" content="https://swabox.cc.cd/" />
    <meta property="og:image" content="https://swabox.cc.cd/logo-nobg.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/png" href="/logo-nobg.png" />

    <link
      rel="preload"
      href="/fonts/swabox-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: https://*.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com https://api.github.com https://static.cloudflareinsights.com https://cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self';"
    />

    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=turnstileOnLoad"
      defer
      crossorigin="anonymous"
    ></script>
    <script>
      window.turnstileOnLoad = function () {
        window.dispatchEvent(new Event('turnstile:ready'));
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
